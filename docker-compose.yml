version: '3.8'

# Production-oriented stack. Copy .env.template → .env and set JWT_SECRET (required).
services:
  postgres:
    image: postgres:14-alpine
    container_name: interviai-postgres
    environment:
      POSTGRES_DB: interviai_dev
      POSTGRES_USER: interviai_user
      POSTGRES_PASSWORD: interviai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - interviai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviai_user -d interviai_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: interviai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - interviai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interviai-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: interviai_dev
      DB_USERNAME: interviai_user
      DB_PASSWORD: interviai_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Required — set in .env (no weak default)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in the environment or .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash-lite}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-InterviAI}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - interviai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8082
    container_name: interviai-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - interviai-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  interviai-network:
    driver: bridge
