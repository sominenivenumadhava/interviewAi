# Dev infrastructure only (Postgres + Redis + pgAdmin).
# Host apps (Spring Boot / Vite) connect with DB_PORT=5433 (mapped from container 5432).
# Example: export DB_PORT=5433  (or set in .env — see .env.template)
services:
  # Development Database Only
  postgres:
    image: postgres:14-alpine
    container_name: interviai-postgres-dev
    environment:
      POSTGRES_DB: interviai_dev
      POSTGRES_USER: interviai_user
      POSTGRES_PASSWORD: interviai_password
    ports:
      # Host 5433 → container 5432 so local apt Postgres on 5432 can coexist
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - interviai-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviai_user -d interviai_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Development Redis
  redis:
    image: redis:7-alpine
    container_name: interviai-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - interviai-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Admin Interface
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: interviai-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@interviai.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - interviai-dev-network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  interviai-dev-network:
    driver: bridge